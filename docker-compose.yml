services:
  a2connectingtothedatabase:
    
    build:
      context: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development 
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
        - "8001:8080"
        - "8080:8081"
    

    depends_on:
       db:
          condition: service_healthy
       
          
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SQLApi1234"
    volumes:
        - db_data:/var/opt/mssql
    ports:
      - "5001:1433"
  
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SQLApi1234' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
    db_data:



